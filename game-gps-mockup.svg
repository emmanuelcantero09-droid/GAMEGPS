    <!-- Panel inferior de navegación -->
    <g filter="url(#softShadow)">
      <rect x="190" y="1024" width="420" height="240" rx="26" fill="#0a0f22" opacity="0.95" stroke="#8a4cff" stroke-width="1.5"/>
    </g>
    <rect x="212" y="1048" width="74" height="18" rx="9" fill="#00e5ff" opacity="0.14" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="249" y="1061" fill="#7ff0ff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="middle">NAVEGANDO</text>
    <text x="212" y="1098" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="700">Times Square, Nueva York</text>
    <text x="212" y="1140" fill="#2de2ff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="800">3,4 km</text>
    <text x="378" y="1140" fill="#c58bff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="800">12 min</text>
    <text x="212" y="1158" fill="#7186ad" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9" letter-spacing="1">DISTANCIA</text>
    <text x="378" y="1158" fill="#7186ad" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9" letter-spacing="1">TIEMPO ESTIMADO</text>
    <rect x="212" y="1172" width="376" height="6" rx="3" fill="#1b2742"/>
    <rect x="212" y="1172" width="142" height="6" rx="3" fill="url(#routeGrad)"/>
    <rect x="212" y="1194" width="376" height="52" rx="16" fill="url(#btnGrad)" filter="url(#neonGlow)"/>
    <text x="400" y="1227" fill="#04121f" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1" text-anchor="middle">INICIAR NAVEGACIÓN</text>

    <!-- Indicador gestual -->
    <rect x="360" y="1288" width="120" height="5" rx="2.5" fill="#ffffff" opacity="0.32"/>
  </g>

  <!-- Brillo del cristal -->
  <path d="M182 120 Q210 100 260 100 L200 1290 Q176 1270 172 1230 Z" fill="#ffffff" opacity="0.025"/>
</svg>
