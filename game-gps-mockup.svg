    <!-- Broadway diagonal -->
    <path d="M236 1304 L520 96" stroke="#315183" stroke-width="6" opacity="0.9"/>

    <!-- Central Park -->
    <rect x="448" y="168" width="152" height="252" rx="12" fill="#0c2a22" stroke="#1a5542" stroke-width="2"/>
    <g fill="#1f7a56" opacity="0.55">
      <circle cx="472" cy="200" r="6"/><circle cx="512" cy="192" r="5"/><circle cx="556" cy="210" r="7"/>
      <circle cx="486" cy="246" r="5"/><circle cx="530" cy="258" r="6"/><circle cx="574" cy="240" r="5"/>
      <circle cx="466" cy="300" r="6"/><circle cx="510" cy="316" r="5"/><circle cx="552" cy="296" r="6"/>
      <circle cx="490" cy="372" r="5"/><circle cx="540" cy="382" r="6"/><circle cx="578" cy="360" r="5"/>
    </g>
    <text x="462" y="315" fill="#5fd6a2" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" letter-spacing="1.4">CENTRAL PARK</text>

    <!-- Nombres de calles -->
    <g fill="#7186ad" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" letter-spacing="0.8">
      <text x="470" y="305">W 42ND ST</text>
      <text x="470" y="525">W 34TH ST</text>
      <text x="470" y="735">W 23RD ST</text>
      <text x="470" y="945">W 14TH ST</text>
      <text x="255" y="690" transform="rotate(-90 255 690)">8TH AVE</text>
      <text x="375" y="690" transform="rotate(-90 375 690)">5TH AVE</text>
      <text x="495" y="690" transform="rotate(-90 495 690)">3RD AVE</text>
    </g>

    <!-- Ruta neón -->
    <path d="M360 900 L360 780 Q360 760 340 760 L330 760 Q310 760 310 740 L310 540 Q310 520 330 520 L340 520 Q360 520 360 500 L360 340"
          fill="none" stroke="url(#routeGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
    <path d="M360 900 L360 780 Q360 760 340 760 L330 760 Q310 760 310 740 L310 540 Q310 520 330 520 L340 520 Q360 520 360 500 L360 340"
          fill="none" stroke="#eafdff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
    <g fill="#ffffff" opacity="0.9">
      <polygon points="360,832 353,844 367,844"/>
      <polygon points="310,660 303,672 317,672"/>
      <polygon points="360,430 353,442 367,442"/>
    </g>

    <!-- Ubicación del usuario -->
    <circle cx="360" cy="900" r="44" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.25"/>
    <circle cx="360" cy="900" r="29" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.5"/>
    <path d="M360 900 L326 802 L394 802 Z" fill="url(#coneGrad)"/>
    <circle cx="360" cy="900" r="15" fill="#00e5ff" filter="url(#neonGlow)"/>
    <circle cx="360" cy="900" r="6" fill="#f0ffff"/>

    <!-- Marcador: destino -->
    <g filter="url(#softShadow)">
      <path d="M360 296 C344 296 332 309 332 325 C332 347 360 374 360 374 C360 374 388 347 388 325 C388 309 376 296 360 296 Z" fill="#7a3cff" stroke="#d5b8ff" stroke-width="2"/>
      <circle cx="360" cy="325" r="13" fill="#1b0f38"/>
      <path d="M360 316 L362.6 322 L369 322.6 L364 327 L365.7 333.4 L360 330 L354.3 333.4 L356 327 L351 322.6 L357.4 322 Z" fill="#ffffff"/>
    </g>
