<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1400" viewBox="0 0 800 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050c"/>
      <stop offset="0.55" stop-color="#080a18"/>
      <stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#9b4dff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="routeGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#c04cff"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#8a3cff"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#263257" stroke-width="1" opacity="0.28"/>
    </pattern>
    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="floorBlur">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="166" y="96" width="468" height="1208" rx="52"/>
    </clipPath>
  </defs>

  <!-- Fondo de estudio -->
  <rect width="800" height="1400" fill="url(#bg)"/>
  <rect width="800" height="1400" fill="url(#grid)"/>
  <ellipse cx="360" cy="620" rx="330" ry="560" fill="url(#glowCyan)"/>
  <ellipse cx="560" cy="320" rx="280" ry="420" fill="url(#glowPurple)"/>
  <ellipse cx="400" cy="1342" rx="250" ry="20" fill="#000000" opacity="0.75" filter="url(#floorBlur)"/>

  <!-- Marco del smartphone -->
  <rect x="150" y="80" width="500" height="1240" rx="64" fill="#0d101a" stroke="#31405f" stroke-width="3"/>
  <rect x="156" y="86" width="488" height="1228" rx="58" fill="none" stroke="#05070d" stroke-width="3"/>
  <rect x="146" y="300" width="6" height="72" rx="3" fill="#1d2537"/>
  <rect x="146" y="392" width="6" height="52" rx="3" fill="#1d2537"/>
  <rect x="648" y="344" width="6" height="92" rx="3" fill="#1d2537"/>
  <rect x="166" y="96" width="468" height="1208" rx="52" fill="#050912"/>

  <!-- CONTENIDO DE LA PANTALLA -->
  <g clip-path="url(#screenClip)">

    <!-- Base del mapa -->
    <rect x="166" y="96" width="468" height="1208" fill="#070c1a"/>

    <!-- Río Hudson -->
    <path d="M166 96 L250 96 L232 1304 L166 1304 Z" fill="#07122b"/>
    <path d="M186 300 Q205 310 224 300 M180 520 Q200 530 220 520 M176 760 Q196 770 216 760 M172 1000 Q192 1010 212 1000" fill="none" stroke="#12315c" stroke-width="2" opacity="0.7"/>

    <!-- Cuadrícula de calles -->
    <g stroke="#1b2b47" stroke-width="2" opacity="0.95">
      <path d="M240 150 H640 M240 220 H640 M240 290 H640 M240 360 H640 M240 430 H640 M240 500 H640 M240 570 H640 M240 640 H640 M240 710 H640 M240 780 H640 M240 850 H640 M240 920 H640 M240 990 H640 M240 1060 H640 M240 1130 H640 M240 1200 H640 M240 1270 H640"/>
      <path d="M270 96 V1304 M330 96 V1304 M390 96 V1304 M450 96 V1304 M510 96 V1304 M570 96 V1304 M620 96 V1304"/>
    </g>
    <g stroke="#2a406a" stroke-width="5" opacity="0.85">
