      <g fill="#0a1226" opacity="0.92" stroke="#2de2ff" stroke-width="1.5">
        <circle cx="600" cy="500" r="25"/>
        <circle cx="600" cy="570" r="25"/>
        <circle cx="600" cy="640" r="25"/>
        <circle cx="600" cy="710" r="25"/>
      </g>
      <g stroke="#d9fbff" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M600 490 V510 M590 500 H610"/>
        <path d="M590 570 H610"/>
        <circle cx="600" cy="640" r="8"/>
        <path d="M600 627 V634 M600 646 V653 M587 640 H594 M606 640 H613"/>
        <path d="M589 706 L600 700 L611 706 L600 712 Z M589 713 L600 707 L611 713"/>
      </g>
    </g>

    <!-- Panel de apariencia -->
    <g filter="url(#softShadow)">
      <rect x="348" y="150" width="258" height="208" rx="18" fill="#0a0f22" opacity="0.9" stroke="#8a4cff" stroke-width="1.5"/>
    </g>
    <text x="366" y="181" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.4">Apariencia</text>
    <circle cx="374" cy="214" r="11" fill="#00e5ff" stroke="#d9fbff" stroke-width="2"/>
    <circle cx="404" cy="214" r="11" fill="#8a3cff" stroke="#d9c6ff" stroke-width="2"/>
    <circle cx="434" cy="214" r="11" fill="#ff3ea5" stroke="#ffd0e8" stroke-width="2"/>
    <rect x="500" y="203" width="46" height="23" rx="11.5" fill="#00e5ff" opacity="0.28" stroke="#00e5ff" stroke-width="1.5"/>
    <circle cx="524" cy="214.5" r="8" fill="#00e5ff"/>
    <text x="366" y="252" fill="#9fb3d9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Modo oscuro</text>
    <text x="366" y="281" fill="#9fb3d9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Brillo de ruta</text>
    <path d="M366 296 H580" stroke="#2a3a5c" stroke-width="5" stroke-linecap="round"/>
    <path d="M366 296 H504" stroke="url(#routeGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="504" cy="296" r="7" fill="#ffffff"/>
    <g>
      <rect x="366" y="312" width="52" height="32" rx="6" fill="#101a32" stroke="#2de2ff" stroke-width="1.2"/>
      <path d="M372 336 L382 320 L392 336" fill="none" stroke="#2de2ff" stroke-width="2.5"/>
      <rect x="426" y="312" width="52" height="32" rx="6" fill="#101a32" stroke="#8a4cff" stroke-width="1.2"/>
      <path d="M432 336 L442 320 L452 336" fill="none" stroke="#b98bff" stroke-width="2.5"/>
      <rect x="486" y="312" width="52" height="32" rx="6" fill="#101a32" stroke="#ff3ea5" stroke-width="1.2"/>
      <path d="M492 336 L502 320 L512 336" fill="none" stroke="#ff8ecb" stroke-width="2.5"/>
    </g>

    <!-- Cabecera -->
    <path d="M190 132 L199 126 L208 132 L208 144 L199 150 L190 144 Z" fill="url(#btnGrad)" filter="url(#neonGlow)"/>
    <text x="220" y="145" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.2">GAME GPS</text>
    <text x="220" y="160" fill="#6f86b3" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="8" letter-spacing="2.2">NAVEGACIÓN URBANA</text>
    <g transform="translate(602 142)">
      <circle r="11" fill="none" stroke="#9fb3d9" stroke-width="2"/>
      <g stroke="#9fb3d9" stroke-width="3" stroke-linecap="round">
        <path d="M0 -16 V-13 M0 13 V16 M-16 0 H-13 M13 0 H16 M-11 -11 L-9 -9 M9 9 L11 11 M11 -11 L9 -9 M-11 11 L-9 9"/>
      </g>
      <circle r="3.5" fill="#9fb3d9"/>
