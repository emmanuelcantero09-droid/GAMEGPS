    <!-- Barra de estado -->
    <text x="190" y="118" fill="#e8f4ff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="600">9:41</text>
    <g fill="#e8f4ff">
      <rect x="556" y="109" width="3" height="6" rx="1"/><rect x="562" y="106" width="3" height="9" rx="1"/><rect x="568" y="103" width="3" height="12" rx="1"/>
      <path d="M578 110 Q585 103 592 110 M581 114 Q585 110 589 114" fill="none" stroke="#e8f4ff" stroke-width="1.6"/>
      <rect x="600" y="105" width="20" height="11" rx="3" fill="none" stroke="#e8f4ff" stroke-width="1.4"/>
      <rect x="603" y="108" width="13" height="5" rx="1.5"/>
      <rect x="621" y="108" width="2" height="5" rx="1"/>
