    <!-- Marcador: estacionamiento -->
    <g filter="url(#softShadow)">
      <path d="M480 620 C466 620 456 631 456 645 C456 663 480 686 480 686 C480 686 504 663 504 645 C504 631 494 620 480 620 Z" fill="#2f7bff" stroke="#a9c9ff" stroke-width="2"/>
      <circle cx="480" cy="645" r="12" fill="#0b1d3d"/>
      <text x="480" y="650" fill="#ffffff" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">P</text>
    </g>

    <!-- Marcador: café -->
    <g filter="url(#softShadow)">
      <path d="M252 506 C238 506 228 517 228 531 C228 549 252 572 252 572 C252 572 276 549 276 531 C276 517 266 506 252 506 Z" fill="#ff3ea5" stroke="#ffb8dd" stroke-width="2"/>
      <circle cx="252" cy="531" r="12" fill="#330a24"/>
      <rect x="246" y="525" width="10" height="11" rx="2" fill="#ffffff"/>
      <path d="M256 528 A4 4 0 0 1 256 535" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Marcador: gasolinera -->
