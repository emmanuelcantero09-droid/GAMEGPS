      <path d="M430 780 C416 780 406 791 406 805 C406 823 430 846 430 846 C430 846 454 823 454 805 C454 791 444 780 430 780 Z" fill="#00c2d6" stroke="#a6f6ff" stroke-width="2"/>
      <circle cx="430" cy="805" r="12" fill="#032a33"/>
      <rect x="424" y="798" width="8" height="13" rx="1.5" fill="#ffffff"/>
      <path d="M432 801 H437 V808 H432" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    </g>

